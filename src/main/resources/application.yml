spring:
  application:
    name: encaixa-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:encaixa}
    username: ${DB_USER:encaixa_user}
    password: ${DB_PASS:encaixa_pass}
  jpa:
    # O schema e responsabilidade EXCLUSIVA do Flyway. O Hibernate apenas confere
    # se as entidades batem com o banco e falha no startup se houver divergencia.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:encaixa}

server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    br.com.encaixa: DEBUG
    org.hibernate.SQL: DEBUG

encaixa:
  mercadopago:
    # Token de TESTE/PRODUCAO do Mercado Pago (Credenciais). Nunca commitar o valor real.
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    # URL publica (ex: ngrok) para o webhook: https://SEU-HOST/api/public/pagamentos/webhook
    notification-url: ${MERCADOPAGO_NOTIFICATION_URL:}
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
