spring:
  application:
    name: encaixa-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:encaixa}
    username: ${DB_USER:encaixa_user}
    password: ${DB_PASS:encaixa_pass}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:encaixa-realm}

server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    br.com.encaixa: DEBUG
    org.hibernate.SQL: DEBUG

